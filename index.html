<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech+ Hardware Catalog</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f5f7fb;
        }

        header{
            background:#0f172a;
            color:white;
            padding:25px;
            text-align:center;
        }

        header h1{
            font-size:2.2rem;
        }

        header p{
            margin-top:10px;
            opacity:.8;
        }

        .container{
            width:95%;
            max-width:1500px;
            margin:auto;
            padding:30px 0;
        }

        .search{
            margin-bottom:25px;
        }

        .search input{
            width:100%;
            padding:15px;
            font-size:18px;
            border-radius:8px;
            border:1px solid #ccc;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 5px 18px rgba(0,0,0,.08);
            transition:.25s;
            cursor:pointer;
        }

        .card:hover{
            transform:translateY(-6px);
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .info{
            padding:18px;
        }

        .category{
            color:#2563eb;
            font-size:13px;
            font-weight:bold;
            text-transform:uppercase;
        }

        .title{
            font-size:20px;
            margin:10px 0;
        }

        .description{
            color:#555;
            line-height:1.5;
            font-size:15px;
        }

        .button{
            display:inline-block;
            margin-top:18px;
            background:#2563eb;
            color:white;
            text-decoration:none;
            padding:10px 18px;
            border-radius:8px;
        }

        footer{
            text-align:center;
            padding:40px;
            color:#777;
        }
    </style>

</head>

<body>

<header>

<h1>CompTIA Tech+ Hardware Catalog</h1>

<p>Display Components and Attributes</p>

</header>

<div class="container">

<div class="search">

<input
type="text"
id="search"
placeholder="Search products...">

</div>

<div id="catalog" class="grid">

</div>

</div>

<footer>

Northbridge University • CECTPR • GitHub Pages

</footer>

<script>

let products=[];

fetch("data/productos.json")

.then(res=>res.json())

.then(data=>{

products=data;

display(products);

});

function display(items){

const catalog=document.getElementById("catalog");

catalog.innerHTML="";

items.forEach(product=>{

catalog.innerHTML+=`

<div class="card" onclick="location.href='producto.html?id=${product.id}'">

<img src="${product.cover}">

<div class="info">

<div class="category">

${product.category}

</div>

<h2 class="title">

${product.name}

</h2>

<p class="description">

${product.description}

</p>

<a class="button">

View Details

</a>

</div>

</div>

`;

});

}

document.getElementById("search").addEventListener("keyup",function(){

const value=this.value.toLowerCase();

const filtered=products.filter(p=>

p.name.toLowerCase().includes(value) ||

p.category.toLowerCase().includes(value)

);

display(filtered);

});

</script>

</body>

</html>
